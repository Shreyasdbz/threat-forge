name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # can still trigger manually

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lockfile:
    name: Lockfile
    # Temporarily on GitHub-hosted runners; restore self-hosted via #239.
    runs-on: ubuntu-latest
    env:
      CARGO_HOME: ${{ github.workspace }}/.cargo-home
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".node-version"

      - name: Verify package registry and integrity
        run: node scripts/check-lockfile-registry.mjs

      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master 2026-02-13
        with:
          toolchain: stable

      - name: Verify Tauri JavaScript and Rust versions align
        run: node scripts/check-tauri-version-alignment.mjs

  lint:
    name: Lint
    needs: [lockfile]
    # Temporarily on GitHub-hosted runners; restore self-hosted via #239.
    runs-on: ubuntu-latest
    env:
      CARGO_HOME: ${{ github.workspace }}/.cargo-home
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".node-version"
          cache: "npm"

      - run: npm ci

      - name: Biome lint + format check
        run: npx biome check .

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: E2E TypeScript type check
        run: npm run check:e2e-types

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libdbus-1-dev \
            libssl-dev

      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master 2026-02-13
        with:
          toolchain: stable
          components: clippy, rustfmt

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.CARGO_HOME }}/registry
            ${{ env.CARGO_HOME }}/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Rust format check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Fetch locked Rust dependencies
        run: cargo fetch --manifest-path src-tauri/Cargo.toml --locked

      - name: Clippy lint
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --frozen -- -D warnings

  test:
    name: Test
    needs: [lockfile]
    # Temporarily on GitHub-hosted runners; restore self-hosted via #239.
    runs-on: ubuntu-latest
    env:
      CARGO_HOME: ${{ github.workspace }}/.cargo-home
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".node-version"
          cache: "npm"

      - run: npm ci

      - name: Frontend tests
        run: npx vitest --run

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libdbus-1-dev \
            libssl-dev

      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master 2026-02-13
        with:
          toolchain: stable

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.CARGO_HOME }}/registry
            ${{ env.CARGO_HOME }}/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Rust tests
        run: |
          cargo fetch --manifest-path src-tauri/Cargo.toml --locked
          cargo test --manifest-path src-tauri/Cargo.toml --frozen

      - name: Compare browser downloads with MCP exports
        id: export-parity
        env:
          THREATFORGE_MCP_BINARY: ./src-tauri/target/debug/threatforge-mcp
        run: |
          npx playwright install --with-deps chromium
          npx playwright test e2e/export-parity.spec.ts

      - name: Summarize export parity results
        id: summarize-export-parity
        if: always()
        run: node scripts/summarize-playwright.mjs

      - name: Upload export parity failure evidence
        if: (failure() && steps.export-parity.outcome == 'failure') || steps.summarize-export-parity.outputs['has-flaky'] == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: export-parity-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Verify committed scene WASM and glue
        run: |
          rustup toolchain install 1.99.1 --profile minimal --target wasm32-unknown-unknown
          archive="$RUNNER_TEMP/wasm-bindgen.tar.gz"
          curl --fail --silent --show-error --location \
            https://github.com/wasm-bindgen/wasm-bindgen/releases/download/0.2.114/wasm-bindgen-0.2.114-x86_64-unknown-linux-musl.tar.gz \
            --output "$archive"
          echo "ce21be002bdbc22ede2a5cf250cb801d2106956fc3c529c75d9452729db3490c  $archive" | sha256sum --check
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP"
          export PATH="$RUNNER_TEMP/wasm-bindgen-0.2.114-x86_64-unknown-linux-musl:$PATH"
          bash scripts/build-scene-wasm.sh
          git diff --exit-code -- public/scene/renderer.js public/scene/renderer_bg.wasm

  e2e:
    name: E2E Tests
    needs: [test]
    # Temporarily on GitHub-hosted runners; restore self-hosted via #239.
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.61.1-jammy@sha256:7b86926fff94374389e8e1f4fdc5c76d050d4a06a7886bb537bf412b20e2b71e
    env:
      CANVAS_VISUAL_BASELINES: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".node-version"
          cache: "npm"

      - run: npm ci

      - name: Run E2E tests
        run: npx playwright test

      - name: Summarize E2E results
        id: summarize
        if: always()
        run: node scripts/summarize-playwright.mjs

      - name: Build E2E artifact manifest
        if: always()
        run: node scripts/build-artifact-manifest.mjs

      - name: Upload Playwright report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        # `failure()` alone must keep gating upload even if the summarize step above is
        # skipped or itself fails, so failure evidence is never lost to an unset output.
        if: failure() || steps.summarize.outputs['has-flaky'] == 'true'
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  build:
    name: Build (${{ matrix.platform }})
    needs: [lint, test]
    # Temporarily on GitHub-hosted runners; restore self-hosted via #239.
    runs-on: ${{ matrix.platform }}
    env:
      CARGO_HOME: ${{ github.workspace }}/.cargo-home
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".node-version"
          cache: "npm"

      - run: npm ci

      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master 2026-02-13
        with:
          toolchain: stable

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.CARGO_HOME }}/registry
            ${{ env.CARGO_HOME }}/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libdbus-1-dev \
            libssl-dev \
            xdg-utils

      # The Lockfile job runs this on Linux only, so a Windows-specific break in the guard
      # itself stayed invisible until it failed the v0.3.0 release build. The release matrix
      # runs it on every platform; this makes pull requests do the same.
      - name: Verify package registry and integrity
        run: node scripts/check-lockfile-registry.mjs

      - name: Build Tauri app
        run: |
          cargo fetch --manifest-path src-tauri/Cargo.toml --locked
          npx tauri build -- --frozen

      - name: Build web app
        if: runner.os == 'Linux'
        run: npm run build:web

      - name: Validate Cloudflare Worker bundle
        if: runner.os == 'Linux'
        run: npm run check:worker

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binaries-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: warn
